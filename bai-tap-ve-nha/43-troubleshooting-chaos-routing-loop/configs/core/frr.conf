!
hostname core
password zebra
enable password zebra
!
interface eth1
  ip address 10.50.1.1/24
  ip ospf passive
!
interface eth2
  ip address 10.0.1.1/30
!
interface eth3
  ip address 10.0.2.1/30
!
ip route 198.51.100.0/24 10.0.2.2
!
router ospf
  ospf router-id 1.1.1.1
  network 10.50.1.0/24 area 0
  network 10.0.1.0/30 area 0
  network 10.0.2.0/30 area 0
!
line vty
!
