# dnsmasq.conf — DNS server nội bộ cho LAN 10.0.5.0/24
port=53
log-queries
log-facility=/var/log/dnsmasq.log

# Chỉ lắng nghe trên địa chỉ được chỉ định
listen-address=127.0.0.1
bind-interfaces

# Không forward query ra ngoài (DNS nội bộ thuần)
no-resolv

# Bản ghi dịch vụ nội bộ
address=/app.local/10.0.5.90
