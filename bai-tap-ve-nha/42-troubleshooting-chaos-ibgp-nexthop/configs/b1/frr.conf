!
hostname b1
password zebra
enable password zebra
!
interface lo
  ip address 10.255.0.2/32
!
interface eth1
  ip address 10.0.1.2/30
!
interface eth2
  ip address 203.0.113.1/30
!
router ospf
  ospf router-id 10.255.0.2
  network 10.255.0.2/32 area 0
  network 10.0.1.0/30 area 0
!
router bgp 65001
  bgp router-id 10.255.0.2
  no bgp ebgp-requires-policy
  neighbor 10.255.0.1 remote-as 65001
  neighbor 10.255.0.1 update-source lo
  neighbor 203.0.113.2 remote-as 65010
  !
  address-family ipv4 unicast
    network 10.30.1.0/24
  exit-address-family
!
line vty
!
