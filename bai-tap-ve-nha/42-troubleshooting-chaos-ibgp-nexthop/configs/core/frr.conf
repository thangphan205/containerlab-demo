!
hostname core
password zebra
enable password zebra
!
interface lo
  ip address 10.255.0.1/32
!
interface eth1
  ip address 10.30.1.1/24
  ip ospf passive
!
interface eth2
  ip address 10.0.1.1/30
!
interface eth3
  ip address 10.0.2.1/30
!
router ospf
  ospf router-id 10.255.0.1
  network 10.255.0.1/32 area 0
  network 10.30.1.0/24 area 0
  network 10.0.1.0/30 area 0
  network 10.0.2.0/30 area 0
!
route-map PREF-BACKUP permit 10
  set local-preference 200
!
router bgp 65001
  bgp router-id 10.255.0.1
  no bgp ebgp-requires-policy
  neighbor 10.255.0.2 remote-as 65001
  neighbor 10.255.0.2 update-source lo
  neighbor 10.255.0.3 remote-as 65001
  neighbor 10.255.0.3 update-source lo
  !
  address-family ipv4 unicast
    neighbor 10.255.0.3 route-map PREF-BACKUP in
  exit-address-family
!
line vty
!
