!
hostname b2
password zebra
enable password zebra
!
interface lo
  ip address 10.255.0.3/32
!
interface eth1
  ip address 10.0.2.2/30
!
interface eth2
  ip address 203.0.113.5/30
!
router ospf
  ospf router-id 10.255.0.3
  network 10.0.2.0/30 area 0
!
router bgp 65001
  bgp router-id 10.255.0.3
  no bgp ebgp-requires-policy
  neighbor 10.255.0.1 remote-as 65001
  neighbor 10.255.0.1 update-source lo
  neighbor 203.0.113.6 remote-as 65020
  !
  address-family ipv4 unicast
    network 10.30.1.0/24
    neighbor 10.255.0.1 next-hop-self
  exit-address-family
!
line vty
!
