!
! Router của nhà mạng ISP-B (AS 65020) — KHÔNG thuộc quyền quản trị của bạn
! Đường backup, nhà mạng prepend AS-path để khách hàng ưu tiên ISP-A
!
hostname isp-b
password zebra
enable password zebra
!
interface eth1
  ip address 203.0.113.6/30
!
ip route 198.51.100.0/24 blackhole
!
route-map PREPEND-OUT permit 10
  set as-path prepend 65020 65020
!
router bgp 65020
  bgp router-id 203.0.113.6
  no bgp ebgp-requires-policy
  neighbor 203.0.113.5 remote-as 65001
  !
  address-family ipv4 unicast
    network 198.51.100.0/24
    neighbor 203.0.113.5 route-map PREPEND-OUT out
  exit-address-family
!
line vty
!
