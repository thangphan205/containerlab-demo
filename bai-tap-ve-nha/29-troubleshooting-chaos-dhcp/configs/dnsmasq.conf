# dnsmasq.conf — DHCP server trung tâm, cấp IP cho 2 site qua relay
port=0
log-dhcp
log-facility=/var/log/dnsmasq.log

# Site HQ — LAN 10.0.1.0/24 (relay giaddr 10.0.1.1)
dhcp-range=set:hq,10.0.1.100,10.0.1.200,255.255.255.0,1h
dhcp-option=tag:hq,3,10.0.1.254

# Site chi nhánh — LAN 10.0.2.0/24 (relay giaddr 10.0.2.1)
dhcp-range=set:branch,10.0.20.100,10.0.20.200,255.255.255.0,1h
dhcp-option=tag:branch,3,10.0.2.1
