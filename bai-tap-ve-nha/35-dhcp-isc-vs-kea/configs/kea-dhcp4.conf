// kea-dhcp4.conf — Kea DHCPv4 server cho dhcp-kea
// Bài 35: Triển khai DHCP Server — ISC DHCP vs Kea DHCP
{
  "Dhcp4": {
    "interfaces-config": {
      "interfaces": [ "eth1" ]
    },
    "lease-database": {
      "type": "memfile",
      "lfc-interval": 3600
    },
    "valid-lifetime": 3600,
    "renew-timer": 1800,
    "rebind-timer": 3150,

    // TODO: khai subnet4 cho 10.0.2.0/24, pool 10.0.2.100 - 10.0.2.200,
    // gateway 10.0.2.1, DNS 8.8.8.8
    //
    // Cú pháp ("id" bắt buộc từ Kea 2.6.x, số nguyên duy nhất cho mỗi subnet):
    // "subnet4": [
    //   {
    //     "id": <số nguyên, vd 1>,
    //     "subnet": "<network>/<prefix-length>",
    //     "pools": [ { "pool": "<start-ip> - <end-ip>" } ],
    //     "option-data": [
    //       { "name": "routers", "data": "<gateway-ip>" },
    //       { "name": "domain-name-servers", "data": "<dns-ip>" }
    //     ]
    //   }
    // ]
    "subnet4": []
  }
}
