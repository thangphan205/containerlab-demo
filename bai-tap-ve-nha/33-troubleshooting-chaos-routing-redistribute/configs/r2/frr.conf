!
hostname r2
password zebra
enable password zebra
!
interface eth1
  ip address 10.10.12.2/30
!
interface eth2
  ip address 203.0.113.1/30
!
router ospf
  ospf router-id 2.2.2.2
  network 10.10.12.0/30 area 0
  default-information originate always
!
ip prefix-list LAN-OUT seq 5 permit 10.10.1.0/24
!
route-map TO-ISP permit 10
  match ip address prefix-list LAN-OUT
!
router bgp 65001
  bgp router-id 2.2.2.2
  no bgp ebgp-requires-policy
  neighbor 203.0.113.2 remote-as 65010
  !
  address-family ipv4 unicast
    redistribute ospf
    neighbor 203.0.113.2 route-map TO-ISP out
  exit-address-family
!
