!
hostname r1
password zebra
enable password zebra
!
interface eth1
  ip address 10.10.1.1/24
  ip ospf passive
!
interface eth2
  ip address 10.10.2.1/24
  ip ospf passive
!
interface eth3
  ip address 10.10.12.1/30
  ip ospf passive
!
router ospf
  ospf router-id 1.1.1.1
  network 10.10.1.0/24 area 0
  network 10.10.2.0/24 area 0
  network 10.10.12.0/30 area 0
!
