name: ntp-lab
prefix: ""

topology:
  nodes:
    r1:
      kind: linux
      image: wbitt/network-multitool:3.22.2
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - ip addr add 10.0.0.1/24 dev eth1
        - ip addr add 10.0.1.1/24 dev eth2
        - ip addr add 10.0.2.1/24 dev eth3
    ntp-server:
      kind: linux
      image: wbitt/network-multitool:3.22.2
      exec:
        # apk phải chạy TRƯỚC khi đổi default route (cần mgmt để tải gói)
        - apk add --no-cache chrony
        - ip addr add 10.0.0.10/24 dev eth1
        - ip route replace default via 10.0.0.1 dev eth1
    client-a:
      kind: linux
      image: wbitt/network-multitool:3.22.2
      exec:
        - apk add --no-cache chrony
        - ip addr add 10.0.1.10/24 dev eth1
        - ip route replace default via 10.0.1.1 dev eth1
    client-b:
      kind: linux
      image: wbitt/network-multitool:3.22.2
      exec:
        - apk add --no-cache chrony
        - ip addr add 10.0.2.10/24 dev eth1
        - ip route replace default via 10.0.2.1 dev eth1

  links:
    - endpoints: ["ntp-server:eth1", "r1:eth1"]
    - endpoints: ["client-a:eth1", "r1:eth2"]
    - endpoints: ["client-b:eth1", "r1:eth3"]
