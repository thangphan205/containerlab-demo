# nginx-off.conf — dồn nginx có sẵn trong image multitool sang cổng phụ
# để nhường 0.0.0.0:80 cho haproxy (VIP LB thật phải nghe port 80).
worker_processes 1;
pid /var/run/nginx.pid;

events {
    worker_connections 512;
}

http {
    server {
        listen 127.0.0.1:8888;
        return 404;
    }
}
