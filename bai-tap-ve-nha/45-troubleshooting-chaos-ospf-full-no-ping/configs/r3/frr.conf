!
hostname r3
password zebra
enable password zebra
!
interface eth1
  ip address 10.0.23.2/30
!
interface eth2
  ip address 10.20.1.1/25
  ip ospf passive
!
interface eth3
  ip address 10.20.2.1/24
  ip ospf passive
!
router ospf
  ospf router-id 3.3.3.3
  network 10.0.23.0/30 area 0
  network 10.20.1.0/24 area 0
!
line vty
!
