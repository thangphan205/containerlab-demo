name: chaos-ospf-fullnoping-lab
prefix: ""

topology:
  groups:
    routers:
      kind: linux
      image: quay.io/frrouting/frr:10.5.1
    hosts:
      kind: linux
      image: wbitt/network-multitool:3.22.2

  nodes:
    r1:
      group: routers
      binds:
        - ../configs/r1/daemons:/etc/frr/daemons
        - ../configs/r1/frr.conf:/etc/frr/frr.conf
    r2:
      group: routers
      binds:
        - ../configs/r2/daemons:/etc/frr/daemons
        - ../configs/r2/frr.conf:/etc/frr/frr.conf
    r3:
      group: routers
      binds:
        - ../configs/r3/daemons:/etc/frr/daemons
        - ../configs/r3/frr.conf:/etc/frr/frr.conf
    host-hq:
      group: hosts
      exec:
        - ip addr add 10.60.1.10/24 dev eth1
        - ip link set eth1 up
        - ip route del default dev eth0
        - ip route replace default via 10.60.1.1 dev eth1
    host-a:
      group: hosts
      exec:
        # Máy phòng Kinh doanh, IP do bên IT bàn giao theo kế hoạch địa chỉ LAN-A /24
        - ip addr add 10.20.1.200/24 dev eth1
        - ip link set eth1 up
        - ip route del default dev eth0
        - ip route replace default via 10.20.1.1 dev eth1
    host-b:
      group: hosts
      exec:
        # Máy phòng ban mới, cài theo phiếu bàn giao
        - ip addr add 10.20.2.10/24 dev eth1
        - ip link set eth1 up
        - ip route del default dev eth0
        - ip route replace default via 10.20.2.254 dev eth1

  links:
    - endpoints: ["host-hq:eth1", "r1:eth1"]
    - endpoints: ["r1:eth2", "r2:eth1"]
    - endpoints: ["r2:eth2", "r3:eth1"]
    - endpoints: ["r3:eth2", "host-a:eth1"]
    - endpoints: ["r3:eth3", "host-b:eth1"]
