!
hostname r2
password zebra
enable password zebra
!
interface eth1
  ip address 10.0.12.2/30
!
interface eth2
  ip address 10.0.23.1/30
!
router ospf
  ospf router-id 2.2.2.2
  network 10.0.12.0/30 area 0
  network 10.0.23.0/30 area 1
  area 1 stub
  area 1 range 10.20.0.0/22 not-advertise
!
line vty
!
