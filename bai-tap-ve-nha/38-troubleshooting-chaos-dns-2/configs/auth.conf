# dnsmasq — DNS authoritative zone corp.local (10.0.8.54, server team quản lý)
no-resolv
listen-address=10.0.8.54
bind-interfaces
log-queries
log-facility=/var/log/dnsmasq.log

# corp.local là zone local — tên không có record trả NXDOMAIN tại đây
local=/corp.local/

# Records (cập nhật đợt release app mới nhất)
address=/erp.corp.local/10.0.8.90
address=/app.corplocal/10.0.8.90
