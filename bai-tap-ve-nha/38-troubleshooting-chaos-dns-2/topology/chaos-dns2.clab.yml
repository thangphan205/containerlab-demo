name: chaos-dns2-lab
prefix: ""

topology:
  nodes:
    sw:
      kind: linux
      image: wbitt/network-multitool:3.22.2
      exec:
        - ip link add name br0 type bridge
        - ip link set br0 up
        - ip link set eth1 master br0
        - ip link set eth2 master br0
        - ip link set eth3 master br0
        - ip link set eth4 master br0
        - ip link set eth1 up
        - ip link set eth2 up
        - ip link set eth3 up
        - ip link set eth4 up
    resolver:
      kind: linux
      image: wbitt/network-multitool:3.22.2
      binds:
        - ../configs/resolver.conf:/tmp/dnsmasq.conf
      exec:
        - apk add --no-cache dnsmasq
        - ip addr add 10.0.8.53/24 dev eth1
        - cp /tmp/dnsmasq.conf /etc/dnsmasq.conf
        - dnsmasq --conf-file=/etc/dnsmasq.conf
    auth:
      kind: linux
      image: wbitt/network-multitool:3.22.2
      binds:
        - ../configs/auth.conf:/tmp/dnsmasq.conf
      exec:
        - apk add --no-cache dnsmasq
        - ip addr add 10.0.8.54/24 dev eth1
        - cp /tmp/dnsmasq.conf /etc/dnsmasq.conf
        - dnsmasq --conf-file=/etc/dnsmasq.conf
    web:
      kind: linux
      image: wbitt/network-multitool:3.22.2
      exec:
        # nginx đã chạy sẵn trong image multitool (listen 80/443)
        - ip addr add 10.0.8.90/24 dev eth1
        - mkdir -p /usr/share/nginx/html
        - sh -c 'echo "<h1>app.corp.local OK</h1>" > /usr/share/nginx/html/index.html'
    client:
      kind: linux
      image: wbitt/network-multitool:3.22.2
      exec:
        - ip addr add 10.0.8.10/24 dev eth1
        # DNS cấu hình tay từ hồi resolver còn ở IP cũ
        - sh -c 'echo "nameserver 10.0.8.55" > /etc/resolv.conf'

  links:
    - endpoints: ["client:eth1", "sw:eth1"]
    - endpoints: ["resolver:eth1", "sw:eth2"]
    - endpoints: ["auth:eth1", "sw:eth3"]
    - endpoints: ["web:eth1", "sw:eth4"]
