# lb.conf — reverse proxy / load balancer portal NTC (bản sau đợt deploy backend mới)
worker_processes 1;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 512;
}

http {
    access_log /var/log/nginx/access.log;

    upstream portal_backends {
        server 10.0.14.11:8080;
        server 10.0.14.12:80;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://portal_backends;
        }
    }
}
