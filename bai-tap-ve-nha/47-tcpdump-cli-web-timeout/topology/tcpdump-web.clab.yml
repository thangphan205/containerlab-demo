name: tcpdump-web-lab
prefix: ""

topology:
  groups:
    hosts:
      kind: linux
      image: wbitt/network-multitool:3.22.2

  nodes:
    # Switch LAN chi nhánh — gom 2 PC và cổng LAN của fw-hq vào cùng broadcast domain
    sw-hq:
      group: hosts
      exec:
        - ip link add name br0 type bridge
        - ip link set br0 up
        - ip link set eth1 master br0
        - ip link set eth2 master br0
        - ip link set eth3 master br0
        - ip link set eth1 up
        - ip link set eth2 up
        - ip link set eth3 up

    # Gateway kiêm firewall nftables
    fw-hq:
      group: hosts
      binds:
        - ../nftables/ruleset.nft:/tmp/ruleset.nft
      exec:
        - ip addr add 192.168.20.1/24 dev eth1
        - ip addr add 192.168.30.1/24 dev eth2
        - ip link set eth1 up
        - ip link set eth2 up
        - sysctl -w net.ipv4.ip_forward=1
        # apk cần default route mgmt (eth0) — phải chạy trước mọi thao tác route
        - apk add --no-cache nftables tcpdump
        - mkdir -p /etc/nftables
        - cp /tmp/ruleset.nft /etc/nftables/ruleset.nft
        - nft -f /etc/nftables/ruleset.nft

    # Hệ thống đặt hàng nội bộ — nginx đã chạy sẵn trong image multitool (listen 80)
    web-hq:
      group: hosts
      exec:
        - ip addr add 192.168.30.80/24 dev eth1
        - ip link set eth1 up
        - apk add --no-cache tcpdump
        - mkdir -p /usr/share/nginx/html
        - sh -c 'echo "<h1>order-system OK</h1>" > /usr/share/nginx/html/index.html'
        - ip route replace default via 192.168.30.1 dev eth1

    # Máy ca sáng — vẫn đặt hàng bình thường
    pc-01:
      group: hosts
      exec:
        - ip addr add 192.168.20.35/24 dev eth1
        - ip link set eth1 up
        - apk add --no-cache tcpdump
        - ip route replace default via 192.168.20.1 dev eth1

    # Máy ca đêm (dải mới cấp) — báo không vào được hệ thống
    pc-02:
      group: hosts
      exec:
        - ip addr add 192.168.20.150/24 dev eth1
        - ip link set eth1 up
        - apk add --no-cache tcpdump
        - ip route replace default via 192.168.20.1 dev eth1

  links:
    - endpoints: ["pc-01:eth1", "sw-hq:eth1"]
    - endpoints: ["pc-02:eth1", "sw-hq:eth2"]
    - endpoints: ["sw-hq:eth3", "fw-hq:eth1"]
    - endpoints: ["fw-hq:eth2", "web-hq:eth1"]
